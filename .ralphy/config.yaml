# Ralphy Configuration for Agent Module Reimplementation
# PRD: docs/agent-reimpl-task.md

project:
  name: "synnia-agent-new"
  language: "Rust + TypeScript"
  framework: "Tauri + Rig.rs + assistant-ui"

prd:
  path: "docs/agent-reimpl-task.md"

docs:
  task: "docs/agent-reimpl-task.md"
  code_reference: "docs/agent-reimpl-code-reference.md"
  rig_examples: "docs/rig/rig/rig-core/examples/"
  models_types: "src/features/models/types.ts"
  models_registry: "src/features/models/index.ts"

commands:
  check: "cargo check -p synnia"
  test: "cargo test -p synnia features::agent_new"
  clippy: "cargo clippy -p synnia"
  tsc: "pnpm tsc --noEmit"

rules:
  # Implementation guidelines
  - "严格按照 agent-reimpl-task.md 中的 Phase 顺序实现"
  - "参考 agent-reimpl-code-reference.md 中的示例代码"
  - "随时查看旧模块 src-tauri/src/features/agent/ 作为参考"
  - "不删除旧的 agent 和 chat 模块"
  
  # Architecture
  - "模型注册在前端 (src/features/models/)，Provider 注册在后端"
  - "后端实现 get_available_providers 命令供前端过滤可用模型"
  - "执行器需支持流式/非流式 Fallback"
  - "使用数据库连接池避免重复连接"
  - "流式输出使用缓冲机制"
  
  # Code style
  - "代码注释使用英文"
  - "保持与项目现有代码风格一致"
  
  # Testing
  - "每个 Phase 完成后运行 cargo test 验证"
  - "前端完成后运行 pnpm tsc --noEmit 验证"
  - "只需单元测试通过，不需要接入系统"

boundaries:
  never_touch:
    - "src-tauri/src/features/agent/**"   # 旧模块，不删除
    - "src-tauri/src/features/chat/**"    # 旧模块，不删除
    - "src/features/chat/**"              # 旧模块，不删除
    - "*.lock"
    - "node_modules/**"
    - "target/**"
    
  focus_areas:
    - "src-tauri/src/features/agent_new/**"  # 新后端模块
    - "src/features/chat_new/**"              # 新前端模块

  reference:
    - "src-tauri/src/features/agent/**"   # 旧后端模块参考
    - "src/features/chat/**"              # 旧前端模块参考
    - "src/features/models/types.ts"      # 模型类型定义
    - "src/features/models/index.ts"      # 模型注册逻辑
    - "docs/agent-reimpl-code-reference.md"  # 代码示例

phases:
  - name: "Phase 1: 后端基础设施"
    tasks:
      - "创建 agent_new/ 目录结构"
      - "实现 storage/mod.rs + repository.rs (带连接池)"
      - "添加 schema.sql (agent_threads, agent_messages)"
      - "编写 storage 单元测试"
      
  - name: "Phase 2: Provider 层"
    tasks:
      - "实现 providers/mod.rs (Provider 工厂)"
      - "实现 providers/gemini.rs"
      - "编写 provider 单元测试"
      
  - name: "Phase 3: 工具层"
    tasks:
      - "实现 tools/mod.rs (工具注册表)"
      - "实现 tools/get_nodes.rs"
      - "编写工具单元测试"
      
  - name: "Phase 4: 执行器"
    tasks:
      - "实现 executor.rs (StreamEvent + AgentExecutor)"
      - "实现流式输出缓冲机制"
      - "实现流式/非流式 Fallback"
      - "编写执行器单元测试"
      
  - name: "Phase 5: Tauri 命令"
    tasks:
      - "实现 commands.rs"
      - "实现 mod.rs"
      - "实现 get_available_providers 命令"
      - "编写命令单元测试"
      
  - name: "Phase 6: 前端模块"
    tasks:
      - "创建 chat_new/ 目录结构"
      - "实现 types.ts"
      - "实现 BackendAdapter.ts"
      - "实现 PersistenceAdapter.ts"
      - "实现 ChatProvider.tsx"
      - "实现 tools/ToolUIRegistry.tsx"
      - "验证 TypeScript 编译通过"

capabilities:
  browser: false
  real_api_test: false  # 只需单元测试
