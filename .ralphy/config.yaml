# Ralphy Configuration for Agent Module Development
# PRD: docs/agent-module-design.md

project:
  name: "synnia-agent"
  language: "Rust"
  framework: "Tauri + Rig.rs"

prd:
  path: "docs/agent-module-design.md"

docs:
  rig: "docs/rig_doc.md"
  rig_examples: "docs/rig/rig/rig-core/examples/"
  zhipu: "https://docs.bigmodel.cn/cn/guide/develop/openai/introduction.md"

commands:
  dev: "pnpm tauri dev"
  check: "cargo check -p synnia"
  test: "cargo test -p synnia"
  test_real: "cargo test -p synnia -- --ignored"
  clippy: "cargo clippy -p synnia"

rules:
  # Implementation guidelines
  - "严格按照 agent-module-design.md 中的 Phase 顺序实现"
  - "参考 docs/rig/rig/rig-core/examples/ 中的示例代码"
  - "只实现 Google 和 Zhipu 两种 provider"
  - "复用现有的 settings 模块读取 API keys"
  
  # Code style
  - "保持与项目现有 Rust 代码风格一致"
  - "使用 thiserror 处理错误"
  - "代码注释使用英文"
  
  # Architecture
  - "Agent 模块放在 src-tauri/src/features/agent/"
  - "不重复定义 UserConfig，复用 settings 模块"
  - "History 和 Model 分离管理"
  
  # Testing
  - "每个 Phase 完成后运行 cargo check 和 cargo clippy"
  - "Phase 6 使用真实 API 测试（#[ignore] 标记）"

boundaries:
  never_touch:
    - "src/**"                       # 前端代码（本阶段不涉及）
    - "src-tauri/src/features/settings/**"  # 只读取，不修改
    - "src-tauri/src/global/**"      # 只读取，不修改
    - "*.lock"
    - "node_modules/**"
    - "target/**"
    
  focus_areas:
    - "src-tauri/src/features/agent/**"  # Agent 核心模块
    - "src-tauri/Cargo.toml"              # 添加依赖

  reference:
    - "src/features/models/types.ts"     # 模型类型定义参考
    - "src-tauri/src/global/database.rs" # 全局 DB 访问
    - "projects/test/"                   # 测试项目

phases:
  - name: "Phase 1: 基础设施"
    tasks:
      - "创建 src-tauri/src/features/agent/mod.rs"
      - "创建 src-tauri/src/features/agent/types.rs"
      - "cargo check 通过"
      
  - name: "Phase 2: 存储层"
    tasks:
      - "创建 storage/schema.sql"
      - "创建 storage/repository.rs"
      - "内存 DB 单元测试通过"
      
  - name: "Phase 3: Provider 层"
    tasks:
      - "创建 providers/registry.rs"
      - "创建 providers/google.rs"
      - "创建 providers/zhipu.rs"
      - "验证 Rig OpenAI client base_url 配置"
      
  - name: "Phase 4: 模型注册"
    tasks:
      - "实现 ModelRegistry"
      - "实现 get_models 命令"
      - "过滤逻辑单元测试通过"
      
  - name: "Phase 5: 状态管理"
    tasks:
      - "创建 state.rs (ChatSession, AgentState)"
      - "并发读写测试通过"
      
  - name: "Phase 6: Agent Engine"
    tasks:
      - "创建 engine.rs"
      - "创建 tools/nodes.rs"
      - "流式/非流式输出测试"
      - "真实 API 集成测试（cargo test -- --ignored）"
      
  - name: "Phase 7: Tauri Commands"
    tasks:
      - "创建 commands/chat.rs"
      - "创建 commands/sessions.rs"
      - "注册到 lib.rs"
      - "编译通过"

capabilities:
  browser: false
  real_api_test: true  # 可使用真实 API 测试
