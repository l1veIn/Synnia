# Product Manager - English Version
# Recipe Package
version: 1

id: product-manager-en
name: Product Manager
description: Plan production manifest and write micro-copy for the character
category: Agent
icon: Briefcase

model:
  category: llm
  capabilities:
    - chat
  defaultParams:
    temperature: 0.5
    maxTokens: 4096

advanced:
  multiTurn: true

input:
  schema:
    $ref: ./schemas/input.yaml

output:
  node: table
  title: "Production Manifest ({{count}} items)"
  collapsed: false
  schema:
    $ref: ./schemas/production-manifest.yaml
