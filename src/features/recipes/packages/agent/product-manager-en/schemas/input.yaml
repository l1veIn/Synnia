# product-manager-en Input Schema

- key: soulProfile
  label: Soul Profile
  type: object
  widget: form-input
  required: true
  connection: input
  config:
    placeholder: Connect the 'Soul Profile' JSON output here
  schema:
    $ref: ../../storyteller-en/schemas/soul-profile.yaml

- key: productType
  label: Product Type
  type: string
  required: true
  connection: input

- key: visualStyle
  label: Visual Style
  type: string
  required: true
  config:
    placeholder: "e.g., 3D Blind Box, Flat Vector, Cyberpunk..."
  connection: input

- key: assetDefinitions
  label: Asset Definitions
  type: array
  widget: table-input
  required: true
  connection: input
  config:
    placeholder: Pass asset definitions JSON
  schema:
    $ref: ../../art-director-en/schemas/asset-definitions.yaml
