# Chief Storyteller - English Version
# Recipe Package
version: 1

id: storyteller-en
name: Chief Storyteller
description: Develop a complete character Soul Profile (Visual DNA, Personality & Color Palette) from a name
category: Agent
icon: BookOpen

model:
  category: llm
  capabilities:
    - chat
  defaultParams:
    temperature: 0.8
    maxTokens: 4096

advanced:
  multiTurn: true

input:
  schema:
    $ref: ./schemas/input.yaml

output:
  node: form
  title: "Soul Profile: {{name}}"
  collapsed: false
  schema:
    $ref: ./schemas/soul-output.yaml
