# art-director-en Input Schema

- key: productionManifest
  label: Production Manifest
  type: array
  widget: table-input
  required: true
  connection: input
  config:
    placeholder: Connect the 'Production Manifest' table here
  schema:
    - key: assetId
      label: Asset ID
      type: string
      required: true
    - key: name
      label: Name
      type: string
      required: true
    - key: visualStyle
      label: Visual Style
      type: string

- key: soulProfile
  label: Soul Profile
  type: object
  widget: form-input
  required: true
  connection: input
  config:
    placeholder: Connect the 'Soul Profile' JSON here
  schema:
    $ref: ../../storyteller-en/schemas/soul-profile.yaml

- key: styleTemplate
  label: Visual Style Template
  type: object
  widget: form-input
  required: true
  connection: input
  config:
    placeholder: Pass style template
  schema:
    - key: name
      label: Style Name
      type: string
      required: true
    - key: style
      label: Style Description
      type: string
      widget: textarea
    - key: lighting
      label: Lighting
      type: string
    - key: mood
      label: Mood
      type: string

- key: assetDefinitions
  label: Asset Definitions
  type: array
  widget: table-input
  required: true
  connection: input
  config:
    placeholder: Pass asset definitions JSON
  schema:
    $ref: ./asset-definitions.yaml
