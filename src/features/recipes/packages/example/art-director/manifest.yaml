# 艺术总监 - Art Director
# Recipe Package
version: 1

id: art-director
name: 艺术总监
description: 为生产清单生成可执行的AI图像提示词（含色彩注入）
category: 创意工具
icon: Palette

executor:
  type: agent
  model:
    category: llm
    capabilities:
      - chat
    defaultParams:
      temperature: 0.7
      maxTokens: 8192
  prompt:
    system:
      $ref: ./prompts/system.md
    user:
      $ref: ./prompts/user.md

input:
  schema:
    $ref: ./schemas/input.yaml

output:
  node: table
  title: "视觉蓝图 ({{count}} 条提示词)"
  collapsed: false
  schema:
    $ref: ./schemas/visual-blueprint.yaml
