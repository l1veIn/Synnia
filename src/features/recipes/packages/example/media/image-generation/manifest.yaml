# Image Generation - Media Recipe
# Single-file manifest (no $ref needed for simple recipes)
version: 1

id: image-generation
name: Image Generation
description: Generate images from text prompts
category: 媒体生成
icon: Image

executor:
  type: agent
  model:
    category: image-generation
    defaultParams: {}
  prompt:
    user: "{{prompt}}"  

# Input schema (inline)
input:
  - key: prompt
    label: Prompt
    type: string
    widget: textarea
    required: true
    config:
      placeholder: "Describe the image you want to generate..."
    connection: input

  - key: negativePrompt
    label: Negative Prompt
    type: string
    widget: textarea
    config:
      placeholder: "What to avoid in the image..."

output:
  node: gallery
  title: "Generated images"
  collapsed: false
