# Reference to Video - Media Recipe
# Uses nested input format (V1.0 standard)
version: 1

id: reference-to-video
name: Reference to Video
description: Generate video using reference images for style/content
category: 媒体生成
icon: Images

executor:
  type: agent
  model:
    category: video-generation
    capabilities: []
    defaultParams: {}
  prompt:
    user: "{{prompt}}"

input:
  schema:
    - key: prompt
      label: Prompt
      type: string
      widget: textarea
      required: true
      config:
        placeholder: "Describe the video scene..."
      connection: input

    - key: image
      label: Reference Images
      type: string
      widget: image-picker
      required: true
      connection: input

output:
  node: video
  title: "Generated video"
  collapsed: false
