# Start-End Frame Video - Media Recipe
# Uses nested input format (V1.0 standard)
version: 1

id: start-end-frame
name: Start-End Frame Video
description: Generate video transitions between two images
category: 媒体生成
icon: SplitSquareVertical

executor:
  type: agent
  model:
    category: video-generation
    capabilities: []
    defaultParams: {}
  prompt:
    user: "{{prompt}}"

input:
  schema:
    - key: prompt
      label: Prompt
      type: string
      widget: textarea
      required: true
      config:
        placeholder: "Describe the transition motion..."
      connection: input

    - key: startImage
      label: Start Frame
      type: string
      widget: image-picker
      required: true
      connection: input

    - key: endImage
      label: End Frame
      type: string
      widget: image-picker
      required: true
      connection: input

output:
  node: video
  title: "Transition video"
  collapsed: false
