# Video Generation - Media Recipe
# Uses nested input format (V1.0 standard)
version: 1

id: video-generation
name: Video Generation
description: Generate videos from text prompts
category: 媒体生成
icon: Film

executor:
  type: agent
  model:
    category: video-generation
    capabilities: []
    defaultParams: {}
  prompt:
    user: "{{prompt}}"

input:
  schema:
    - key: prompt
      label: Prompt
      type: string
      widget: textarea
      required: true
      config:
        placeholder: "Describe the video scene..."
      connection: input

output:
  node: video
  title: "Generated video"
  collapsed: false
