# Naming Master - English Version
# Recipe Package
version: 1

id: naming-master-en
name: Naming Master
description: Generate 9 virtual IP character names using the "Relevance Spectrum" strategy
category: Agent
icon: Wand2

model:
  category: llm
  capabilities:
    - chat
  defaultParams:
    temperature: 0.9
    maxTokens: 4096

advanced:
  multiTurn: true

input:
  schema:
    $ref: ./schemas/input.yaml

output:
  node: selector
  title: "Naming Options ({{count}} items)"
  collapsed: false
  schema:
    $ref: ./schemas/naming-options.yaml
