# naming-master-en Input Schema

- key: productType
  label: Product Type
  type: string
  required: true
  config:
    placeholder: "e.g., Weather App, E-commerce Platform, Fitness App..."
  connection: input

- key: targetAudience
  label: Target Audience
  type: string
  config:
    placeholder: "e.g., Young Professionals, Gen-Z Gamers, New Parents..."
  connection: input

- key: brandTone
  label: Brand Tone
  type: string
  config:
    placeholder: "e.g., Playful, Professional, Tech-savvy, Trendy..."
  connection: input

- key: culturalBackground
  label: Cultural Background
  type: string
  config:
    placeholder: "e.g., Western Minimalist, Asian Cute, Global Fusion..."
  connection: input

- key: specialRequirements
  label: Special Requirements
  type: string
  widget: textarea
  config:
    placeholder: "e.g., Name must be pronounceable globally, avoid puns..."
  connection: input
