# 产品经理 - Product Manager
# Recipe Package
version: 1

id: product-manager
name: 产品经理
description: 规划生产清单并为角色撰写微文案
category: 创意工具
icon: Briefcase

executor:
  type: agent
  model:
    category: llm
    capabilities:
      - chat
    defaultParams:
      temperature: 0.5
      maxTokens: 4096
  prompt:
    system:
      $ref: ./prompts/system.md
    user:
      $ref: ./prompts/user.md

input:
  schema:
    $ref: ./schemas/input.yaml

output:
  node: table
  title: "生产清单 ({{count}} 项)"
  collapsed: false
  schema:
    $ref: ./schemas/production-manifest.yaml
