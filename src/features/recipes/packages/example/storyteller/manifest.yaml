# 首席叙事官 - Storyteller Agent
# Recipe Package
version: 1

id: storyteller
name: 首席叙事官
description: 根据名称发展完整的角色灵魂档案（视觉DNA、人格矩阵和色彩基因）
category: 创意工具
icon: BookOpen

executor:
  type: agent
  model:
    category: llm
    capabilities:
      - chat
    defaultParams:
      temperature: 0.8
      maxTokens: 4096
  prompt:
    system:
      $ref: ./prompts/system.md
    user:
      $ref: ./prompts/user.md

input:
  schema:
    $ref: ./schemas/input.yaml

output:
  node: form
  title: "灵魂档案: {{name}}"
  collapsed: false
  schema:
    $ref: ./schemas/soul-output.yaml
