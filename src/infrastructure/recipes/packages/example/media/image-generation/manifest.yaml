# Image Generation - Media Recipe
# Uses nested input format (V1.0 standard)
version: 1

id: image-generation
name: Image Generation
description: Generate images from text prompts
category: 媒体生成
icon: Image

executor:
  type: agent
  model:
    category: image-generation
    defaultParams: {}
  prompt:
    user: "{{prompt}}"  

# Input schema (nested format)
input:
  schema:
    - key: prompt
      label: Prompt
      type: string
      widget: textarea
      required: true
      config:
        placeholder: "Describe the image you want to generate..."
      connection: input

    - key: negativePrompt
      label: Negative Prompt
      type: string
      widget: textarea
      config:
        placeholder: "What to avoid in the image..."

output:
  node: gallery
  title: "Generated images"
  collapsed: false
