# 命名大师 - Naming Master
# Recipe Package
version: 1

id: naming-master
name: 命名大师
description: 使用"相关度光谱"策略，为品牌生成9个虚拟IP角色名称
category: 创意工具/品牌设计
icon: Wand2

executor:
  type: agent
  model:
    category: llm
    capabilities:
      - chat
    defaultParams:
      temperature: 0.9
      maxTokens: 4096
  prompt:
    system:
      $ref: ./prompts/system.md
    user:
      $ref: ./prompts/user.md

input:
  schema:
    $ref: ./schemas/input.yaml

output:
  node: selector
  title: "命名方案 ({{count}}项)"
  collapsed: false
  schema:
    $ref: ./schemas/naming-options.yaml
