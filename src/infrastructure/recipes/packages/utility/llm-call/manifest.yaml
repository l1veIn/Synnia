# LLM Call - Basic Utility Recipe
version: 1

id: llm-call
name: LLM Call
description: Basic LLM invocation with custom prompts
category: 实用工具
icon: Sparkles

executor:
  type: agent
  model:
    category: llm
    capabilities:
      - chat
      - vision
    defaultParams:
      temperature: 0.7
      maxTokens: 2048
  prompt:
    system:
      $ref: ./prompts/system.md
    user:
      $ref: ./prompts/user.md

input:
  schema:
    $ref: ./schemas/input.yaml

output:
  node: text
  title: "Response"
  collapsed: false
